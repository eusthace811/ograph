[workspace]
members = ["ograph-core", "ograph-cli", "ograph-bench"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ograph-core = { path = "ograph-core" }
oxrdf = "=0.3.5"
oxsdatatypes = "=0.2.4"
oxttl = "=0.2.5"
spargebra = "=0.4.8"
spareval = { version = "=0.2.9", features = ["sep-0002"] }
redb = "=5.0.0"
siphasher = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
regex = "1"
toml = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
