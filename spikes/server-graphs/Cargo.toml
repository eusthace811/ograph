[package]
name = "server-graphs"
version = "0.1.0"
edition = "2024"

[dependencies]
oxrdf = "0.3.5"
oxttl = "0.2"
oxsdatatypes = "0.2.4"
redb = "5.0.0"
spareval = { version = "0.2.9", features = ["sep-0002"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1
